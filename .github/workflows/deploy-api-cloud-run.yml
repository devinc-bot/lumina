name: Deploy API

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      MIGRATOR_JOB_NAME: ${{ vars.MIGRATOR_JOB_NAME }}
      SCHEDULER_JOB_NAME: ${{ vars.SCHEDULER_JOB_NAME }}
      REPOSITORY: ${{ vars.AR_REPO }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
      SCHEDULER_SERVICE_ACCOUNT: ${{ vars.SCHEDULER_SERVICE_ACCOUNT }}
      INTERNAL_JOBS_OIDC_AUDIENCE: ${{ vars.INTERNAL_JOBS_OIDC_AUDIENCE }}
      API_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/api:${{ github.sha }}
      API_CACHE_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/api-cache:staging
      MIGRATOR_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/migrator:${{ github.sha }}
      MIGRATOR_CACHE_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/migrator-cache:staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate deploy configuration
        run: bash deploy/scripts/cloud-run/validate-deploy-config.sh

      # Workload Identity Federation → impersonate the deploy SA (no JSON keys).
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Install gcloud CLI on the runner (uses credentials from the auth step).
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # docker ↔ Artifact Registry auth for this region.
      - name: Configure Docker
        run: bash deploy/scripts/cloud-run/configure-docker.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # API image (Dockerfile target "runtime") → Artifact Registry as api:<sha>.
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=registry,ref=${{ env.API_CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.API_CACHE_IMAGE }},mode=max

      # Migrator image (Dockerfile target "migrator": Drizzle + SQL) → migrator:<sha>.
      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrator
          push: true
          tags: ${{ env.MIGRATOR_IMAGE }}
          cache-from: type=registry,ref=${{ env.MIGRATOR_CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.MIGRATOR_CACHE_IMAGE }},mode=max

      # Point the Cloud Run Job at the new migrator image (definition only).
      - name: Update migrator Cloud Run Job
        run: bash deploy/scripts/cloud-run/update-migrator-job.sh

      # Run migrations once and wait; must succeed before API rollout.
      - name: Execute migrator Job
        run: bash deploy/scripts/cloud-run/execute-migrator-job.sh

      # Roll out the API service to the new api:<sha> image.
      - name: Deploy to Cloud Run
        run: bash deploy/scripts/cloud-run/deploy-service.sh

      # GET /api/health/ready on the live service URL (with retries).
      - name: Probe API readiness
        run: bash deploy/scripts/cloud-run/probe-health.sh

      - name: Verify Scheduler OIDC target
        run: bash deploy/scripts/cloud-run/verify-scheduler-config.sh
